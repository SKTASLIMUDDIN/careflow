  </g>
  <!-- Wordmark Text -->
  <g transform="translate(56, 12)">
    <text x="0" y="22" font-family="'Geist', 'Segoe UI', -apple-system, sans-serif" font-size="26" font-weight="900" fill="#0f172a" letter-spacing="-0.5">
